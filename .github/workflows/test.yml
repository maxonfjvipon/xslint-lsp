---
name: test
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-24.04, macos-15, windows-2022 ]
        node: [ 20, 22 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run lint
      - run: npm test
